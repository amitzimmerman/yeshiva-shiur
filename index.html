<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ישיבת דרור חירן</title>
  <link rel="icon" type="image/png" href="dror-logo.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#1b2d4f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="דרור חירן" />
  <link rel="apple-touch-icon" href="dror-logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <div class="logo-area">
      <img src="dror-logo.png" alt="ישיבת דרור חירן" class="logo-img" />
      <div class="logo-text">
        <span class="logo-main">ישיבת דרור חירן</span>
        <span class="logo-sub">שיעורי תורה להאזנה והורדה</span>
      </div>
    </div>
    <!-- Breadcrumb -->
    <nav class="breadcrumb" id="breadcrumb" style="display:none;">
      <button class="bc-btn" id="bcHome">🏠 ראשי</button>
      <span class="bc-sep">›</span>
      <button class="bc-btn" id="bcRabbi" style="display:none;"></button>
      <span class="bc-sep" id="bcSep2" style="display:none;">›</span>
      <span class="bc-current" id="bcCurrent"></span>
    </nav>
    <button class="btn-reload-top" id="reloadBtn">🔄</button>
  </div>
</header>

<!-- Filter bar (shared) -->
<div class="filter-bar">
  <div class="filter-bar-inner">
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="חיפוש..." />
      <button class="search-btn">🔍</button>
    </div>
    <!-- Shiurim-only controls -->
    <div id="shiurControls" style="display:none; display:contents;">
      <div class="filter-group">
        <label>מיון</label>
        <select id="sortBy">
          <option value="name">א–ת</option>
          <option value="date_desc">חדש ראשון</option>
          <option value="date_asc">ישן ראשון</option>
        </select>
      </div>
      <button class="btn-reset" id="resetBtn">אפס</button>
    </div>
  </div>
</div>

<!-- Quick filters (shiurim only) -->
<div class="quick-filter-bar" id="quickFilterBar" style="display:none;">
  <div class="quick-filter-inner">
    <span class="qf-label">הצג:</span>
    <button class="qf-btn active" data-filter="all">הכל</button>
    <button class="qf-btn" data-filter="liked">❤️ אהבתי</button>
    <button class="qf-btn" data-filter="watched">✅ ראיתי</button>
    <button class="qf-btn" data-filter="unwatched">🔵 לא ראיתי</button>
    <span class="stats-pill"              id="statsTotal"></span>
    <span class="stats-pill liked-pill"   id="statsLiked"></span>
    <span class="stats-pill watched-pill" id="statsWatched"></span>
    <button class="btn-dl-all" id="dlAllBtn">⬇ הורד סדרה</button>
  </div>
</div>

<main class="site-main">
  <!-- Loading -->
  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <p>טוען מ-Google Drive...</p>
  </div>

  <!-- Error -->
  <div class="error-state" id="errorState" style="display:none;">
    <div class="error-icon">⚠️</div>
    <p id="errorMsg"></p>
    <button class="btn-setup" id="reloadOnError">🔄 נסה שוב</button>
  </div>

  <!-- Rabbis grid -->
  <div id="rabbisGrid" class="card-grid" style="display:none;"></div>

  <!-- Series grid -->
  <div id="seriesGrid" class="card-grid" style="display:none;"></div>

  <!-- Shiurim list -->
  <div id="shiurimList" class="shiurim-list" style="display:none;"></div>

  <!-- Empty -->
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="empty-icon">🔍</div>
    <p id="emptyMsg">לא נמצאו תוצאות</p>
  </div>
</main>

<!-- Player Page (full screen overlay) -->
<div id="playerPage" class="player-page" style="display:none;">
  <div class="pp-header">
    <button id="ppClose" class="pp-close">← חזרה</button>
    <div class="pp-crumb" id="ppCrumb"></div>
  </div>
  <div class="pp-body">
    <audio id="ppAudio" class="pp-audio" controls preload="none"></audio>
    <div class="pp-meta">
      <h2 class="pp-title" id="ppTitle"></h2>
      <div class="pp-actions">
        <a class="btn-dl pp-action-btn" id="ppDl" target="_blank">⬇ הורד</a>
        <a class="btn-wa pp-action-btn" id="ppWa" target="_blank">📲 שתף</a>
        <button class="pp-action-btn pp-like" id="ppLike">🤍 אהבתי</button>
        <button class="pp-action-btn pp-watch" id="ppWatched">☐ ראיתי</button>
      </div>
    </div>
    <div id="ppSources" class="pp-sources" style="display:none;">
      <div class="pp-sources-title">📄 מקורות השיעור</div>
      <iframe id="ppSourceFrame" class="pp-source-frame" frameborder="0" src=""></iframe>
    </div>
    <div class="pp-nav">
      <button id="ppPrev" class="pp-nav-btn">‹ שיעור קודם</button>
      <span id="ppCounter" class="pp-counter"></span>
      <button id="ppNext" class="pp-nav-btn">שיעור הבא ›</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<template id="cardTemplate">
  <article class="shiur-card">
    <div class="card-icon-col">
      <div class="file-icon">🎵</div>
      <div class="watched-dot" style="display:none;">✅</div>
    </div>
    <div class="card-body">
      <div class="card-meta-top">
        <span class="card-date"></span>
      </div>
      <h3 class="card-title"></h3>
      <div class="card-actions">
        <button class="btn-play">▶ האזן</button>
        <a class="btn-dl" target="_blank">⬇ הורד</a>
        <a class="btn-wa" target="_blank" title="שלח בוואטסאפ">📲</a>
        <div class="card-marks">
          <button class="btn-like"    title="אהבתי">🤍</button>
          <button class="btn-watched" title="סמן כנצפה">☐</button>
        </div>
      </div>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
