name: Update lessons

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JSON
        run: |
          curl -L "${{ secrets.APPS_SCRIPT_URL }}" -o data.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data.json

          git commit -m "Update data" || echo "No changes"

          git push
