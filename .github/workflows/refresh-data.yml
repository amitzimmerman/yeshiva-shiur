name: Refresh data.json

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:         # manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest data from Apps Script
        run: |
          curl -sL --max-redirs 5 \
            "https://script.google.com/macros/s/AKfycbwB3SRzaZvd-redo37KKCHEeFwJW50yxwiQwHNYqOOpahQo2ADVTi8HbsZeQgxau1he5w/exec" \
            -o data.json
          # Validate JSON
          python3 -c "import json,sys; json.load(open('data.json'))" && echo "Valid JSON"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Auto-refresh data.json"
          git push
