name: Sync Shiurim from Drive

on:
  schedule:
    - cron: '0 3 * * *'   # כל יום ב-3:00 UTC = 5:00/6:00 ישראל
  workflow_dispatch:        # הפעלה ידנית מ-GitHub → Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch from Apps Script
        env:
          SCRIPT_URL: ${{ secrets.SCRIPT_URL }}
        run: |
          # נקה רווחים ושורות חדשות מהקישור
          CLEAN_URL=$(printf '%s' "$SCRIPT_URL" | tr -d '[:space:]')
          echo "URL length: ${#CLEAN_URL}"
          echo "URL prefix: ${CLEAN_URL:0:50}"
          if [ -z "$CLEAN_URL" ]; then
            echo "❌ SCRIPT_URL ריק!"
            exit 1
          fi
          curl -fsSL --max-time 300 -o data.json "$CLEAN_URL"
          echo "✅ הקובץ נשמר"

      - name: Validate JSON
        run: |
          python3 - <<'EOF'
          import json, sys

          def count_files(node):
              n = len(node.get('files', []))
              for sub in node.get('folders', []):
                  n += count_files(sub)
              return n

          try:
              data = json.load(open('data.json'))
          except Exception as e:
              print(f"❌ JSON לא תקין: {e}")
              sys.exit(1)
          if isinstance(data, dict) and 'error' in data:
              print(f"❌ שגיאת Script: {data['error']}")
              sys.exit(1)
          if not isinstance(data, list) or len(data) == 0:
              print("❌ נתונים ריקים")
              sys.exit(1)
          total = sum(count_files(r) for r in data)
          print(f"✅ {len(data)} רבנים, {total} שיעורים")
          EOF

      - name: Commit and push
        run: |
          git config user.name  "Sync Bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "ℹ️ אין שינויים — הנתונים עדכניים"
          else
            git commit -m "sync: עדכון שיעורים $(date -u '+%Y-%m-%d')"
            git push
            echo "🚀 data.json עודכן ב-GitHub"
          fi
