name: Sync Shiurim from Drive

on:
  schedule:
    - cron: '0 3 * * *'   # כל יום ב-3:00 UTC = 5:00/6:00 ישראל
  workflow_dispatch:        # הפעלה ידנית מ-GitHub → Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch from Apps Script
        run: |
          echo "📥 מושך נתונים מ-Apps Script..."
          curl -fsSL --max-time 120 -o data.json "${{ secrets.SCRIPT_URL }}"
          echo "✅ הקובץ נשמר"

      - name: Validate JSON
        run: |
          python3 - <<'EOF'
          import json, sys
          try:
              data = json.load(open('data.json'))
          except Exception as e:
              print(f"❌ JSON לא תקין: {e}")
              sys.exit(1)
          if isinstance(data, dict) and 'error' in data:
              print(f"❌ שגיאת Script: {data['error']}")
              sys.exit(1)
          if not isinstance(data, list) or len(data) == 0:
              print("❌ נתונים ריקים")
              sys.exit(1)
          total = sum(len(f.get('files', [])) for r in data for f in r.get('series', []))
          print(f"✅ {len(data)} רבנים, {total} שיעורים")
          EOF

      - name: Commit and push
        run: |
          git config user.name  "Sync Bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "ℹ️ אין שינויים — הנתונים עדכניים"
          else
            git commit -m "sync: עדכון שיעורים $(date -u '+%Y-%m-%d')"
            git push
            echo "🚀 data.json עודכן ב-GitHub"
          fi
